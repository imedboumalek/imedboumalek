<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" fill="none" role="img" aria-label="Imed Boumalek — Technical Founder, Engineer, Product Owner">
  <defs>
    <radialGradient id="glow" cx="22%" cy="46%" r="60%">
      <stop offset="0%" stop-color="#3D7EFF" stop-opacity="0.30"/>
      <stop offset="70%" stop-color="#3D7EFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accentBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3D7EFF"/>
      <stop offset="100%" stop-color="#5B97FF"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <clipPath id="nameClip">
      <text x="74" y="186" font-family="'Geist','Segoe UI',system-ui,-apple-system,Arial,sans-serif" font-size="86" font-weight="700" letter-spacing="-3">Imed Boumalek</text>
    </clipPath>

    <style>
      .grid   { animation: drift 26s linear infinite; }
      .glow   { transform-origin: 264px 150px; animation: breathe 7s ease-in-out infinite; }
      .cursor { animation: blink 1.1s steps(1,end) infinite; }
      .name   { animation: rise 1.1s cubic-bezier(.16,1,.3,1) both; }
      .shine  { animation: sweep 5.5s cubic-bezier(.16,1,.3,1) infinite; }
      .bar    { stroke-dasharray: 150; stroke-dashoffset: 150; animation: draw 1s ease-out .5s forwards; }
      .role   { opacity: 0; animation: roleCycle 12s infinite; }
      .role.r2 { animation-delay: 3s; }
      .role.r3 { animation-delay: 6s; }
      .role.r4 { animation-delay: 9s; }
      .eyebrow { animation: fade 1s ease-out both; }

      @keyframes drift   { to { transform: translate(56px,56px); } }
      @keyframes breathe { 0%,100% { opacity:.55; transform:scale(1); } 50% { opacity:.9; transform:scale(1.07); } }
      @keyframes blink   { 0%,50% { opacity:1; } 51%,100% { opacity:0; } }
      @keyframes rise    { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:none; } }
      @keyframes fade    { from { opacity:0; } to { opacity:1; } }
      @keyframes sweep   { 0% { transform:translateX(-340px); } 55%,100% { transform:translateX(1240px); } }
      @keyframes draw    { to { stroke-dashoffset:0; } }
      @keyframes roleCycle {
        0%   { opacity:0; transform:translateY(7px); }
        4%   { opacity:1; transform:translateY(0); }
        21%  { opacity:1; transform:translateY(0); }
        25%  { opacity:0; transform:translateY(-7px); }
        100% { opacity:0; }
      }
    </style>
  </defs>

  <!-- backdrop -->
  <rect width="1200" height="320" fill="#0A0A0B"/>
  <g class="grid"><rect x="-112" y="-112" width="1424" height="544" fill="url(#grid)"/></g>
  <ellipse class="glow" cx="264" cy="150" rx="520" ry="300" fill="url(#glow)"/>
  <rect width="1200" height="320" fill="#0A0A0B" opacity="0" />

  <!-- terminal prompt -->
  <g class="eyebrow">
    <text x="76" y="74" font-family="'Geist Mono',ui-monospace,'SF Mono',Menlo,monospace" font-size="17" letter-spacing="1" fill="#6B6B72">imed@dev</text>
    <text x="160" y="74" font-family="'Geist Mono',ui-monospace,'SF Mono',Menlo,monospace" font-size="17" letter-spacing="1" fill="#3D7EFF">~</text>
    <text x="182" y="74" font-family="'Geist Mono',ui-monospace,'SF Mono',Menlo,monospace" font-size="17" letter-spacing="1" fill="#A1A1AA">whoami</text>
    <rect class="cursor" x="262" y="60" width="9" height="18" rx="1" fill="#3D7EFF"/>
  </g>

  <!-- name -->
  <g class="name">
    <text x="74" y="186" font-family="'Geist','Segoe UI',system-ui,-apple-system,Arial,sans-serif" font-size="86" font-weight="700" letter-spacing="-3" fill="#FAFAFA">Imed Boumalek</text>
    <g clip-path="url(#nameClip)">
      <rect class="shine" x="-260" y="96" width="240" height="110" fill="url(#shine)"/>
    </g>
  </g>

  <!-- accent rule -->
  <path class="bar" d="M78 214 H228" stroke="url(#accentBar)" stroke-width="3" stroke-linecap="round"/>

  <!-- cycling roles -->
  <g font-family="'Geist','Segoe UI',system-ui,-apple-system,Arial,sans-serif" font-size="27" fill="#A1A1AA">
    <text class="role r1" x="80" y="262">Technical Founder, building Attraxia.</text>
    <text class="role r2" x="80" y="262">Senior Flutter engineer &amp; product owner.</text>
    <text class="role r3" x="80" y="262">Automation &amp; AI explorer.</text>
    <text class="role r4" x="80" y="262">Motorcycle rider, occasionally at a desk.</text>
  </g>
</svg>
